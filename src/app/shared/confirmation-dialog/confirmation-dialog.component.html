<div class="overlay">
  <div class="confirm-toast">
    <div class="confirm-toast-header">{{ title }}</div>
    <div class="confirm-toast-body">{{ message }}</div>
    <div class="confirm-toast-actions">
      <button (click)="confirm()">Yes</button>
      <button (click)="cancel()">No</button>
    </div>
  </div>
</div>
